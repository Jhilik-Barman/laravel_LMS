
name: LMS CI Pipeline

on:
  push:
    branches:
      - deployment

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: React Frontend Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout latest repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Install frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # 4. Build React application
      - name: Build React Application
        working-directory: frontend
        run: npm run build

      # 5. Upload frontend build artifact
      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: lms-frontend-build
          path: frontend/dist/
          if-no-files-found: error

  backend-test:
    name: Laravel Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Jhilik@1019
          MYSQL_DATABASE: lms_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # 1. Checkout latest repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, xml, curl, zip, gd
          tools: composer:v2
          coverage: none

      # 3. Install Laravel dependencies
      - name: Install Composer Dependencies
        working-directory: laravel-backend
        run: composer install --no-interaction --prefer-dist --no-progress

      # 4. Configure Laravel environment
      - name: Configure Laravel Environment
        working-directory: laravel-backend
        run: |
          cp .env.example .env
          php artisan key:generate

      # 5. Run database migrations
      - name: Run Laravel Migrations
        working-directory: laravel-backend
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lms_db
          DB_USERNAME: root
          DB_PASSWORD: Jhilik@1019
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: php artisan migrate --force

      # 6. Run Laravel automated tests
      - name: Run Laravel Tests
        working-directory: laravel-backend
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lms_db  
          DB_USERNAME: root
          DB_PASSWORD: Jhilik@1019
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: php artisan test
